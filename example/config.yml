server:
  port: "8080"

log:
  level: "info"

auth:
  secret_file: "shared/secret"

rate_limit:
  max_requests: 100
  window_seconds: 60
broker:
  type: "mqtt"
  url: "tcp://localhost:1883"
  client_id: "marketing-app"
  topic: "events"
  enabled: false  # Set to true to enable event broker consumption